# Reference ESPHome config for the Day-10 demo kit.
# The pipeline regenerates the threshold + message per prompt; this
# file is the structural anchor for the LLM.

esphome:
  name: esp32-temperature-alert

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Onboard status LED — flashes when an alert fires.
output:
  - platform: gpio
    pin: GPIO2
    id: status_led
light:
  - platform: binary
    name: "Status LED"
    output: status_led

# DHT22 sensor on GPIO5.
sensor:
  - platform: dht
    pin: GPIO5
    model: DHT22
    update_interval: 30s
    temperature:
      name: "Workshop Temperature"
      id: workshop_temp
      on_value_range:
        below: 5
        then:
          - light.turn_on: status_led
          - http_request.post:
              url: ${JENGAKIT_SIGNAL_API_URL}/v2/send
              headers:
                Content-Type: application/json
              json: |
                {
                  "number": "${JENGAKIT_SIGNAL_NUMBER}",
                  "recipients": ["${JENGAKIT_SIGNAL_NUMBER}"],
                  "message": "Workshop temperature dropped below 5°C — current %.1f°C"
                }
    humidity:
      name: "Workshop Humidity"
      id: workshop_humidity

http_request:
  useragent: jengakit-esp32-temperature-alert/1.0
