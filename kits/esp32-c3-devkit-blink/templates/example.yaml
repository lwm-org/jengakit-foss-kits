# Generated ESPHome example for ESP32-C3 DevKit.
esphome:
  name: esp32-c3-devkit-blink
esp32:
  board: esp32-c3-devkitm-1

# Fill in your wifi: / api: blocks. This reference toggles the onboard LED.
output:
  - platform: gpio
    pin: 2
    id: onboard_led
interval:
  - interval: 500ms
    then:
      - output.turn_on: onboard_led
      - delay: 250ms
      - output.turn_off: onboard_led
